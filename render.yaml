# Deploy the API separately (Vercel hosts only the React frontend).
# Create a free MongoDB Atlas cluster, then set MONGODB_URI in the Render dashboard.
services:
  - type: web
    name: harsh-13985-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
